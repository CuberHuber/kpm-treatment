[project]
name = "kpm-treatment"
version = "0.1.0"
description = "Kaspersky Password Manager (KPM) treatment tooling"
readme = "README.md"
authors = [
    { name = "CuberHuber", email = "lupashcko.rom@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that touch external systems",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ANN"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
skips = []
