[project]
name = "kpm-treatment"
version = "0.2.0"
description = "Kaspersky Password Manager (KPM) treatment tooling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "CuberHuber", email = "lupashcko.rom@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["kaspersky", "password-manager", "kpm", "export", "csv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CuberHuber/kpm-treatment"
Repository = "https://github.com/CuberHuber/kpm-treatment"
Issues = "https://github.com/CuberHuber/kpm-treatment/issues"

[project.scripts]
kpm-treatment = "kpm_treatment.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "bandit>=1.7",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "flake8>=7.1",
    "eo-styleguide>=0.1.1",
    "detect-secrets>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that touch external systems",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ANN"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = ["samples/"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["samples"]
skips = []
